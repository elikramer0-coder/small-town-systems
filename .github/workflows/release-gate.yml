name: release gate
# Red while any price or "what's included" list in pricing.json is still a draft ("confirmed": false).
# Do not merge to main (which publishes the live site) while this is red.
on:
  push:
  pull_request:
jobs:
  prices-confirmed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run release-check
